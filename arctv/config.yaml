name: ArcTV
version: "0.8.3"
slug: arctv
description: Домашний сервер IPTV для телевизоров Samsung (Tizen и Orsay)
url: https://github.com/MrCheng888/arctv-ha
arch:
  - amd64
  - aarch64
startup: application
boot: auto
# сервер — сам процесс 1 (без tini и s6)
init: false
ports:
  8090/tcp: 18090
ports_description:
  8090/tcp: Страница сервера и адреса для телевизоров
# страница сервера внутри Home Assistant (без второго пароля) и пункт в боковом меню; прямой адрес :18090 — с паролем
ingress: true
# домофон (0.7.9): доступ к API Home Assistant (камера, скрипты, таймер) — http://supervisor/core/api, SUPERVISOR_TOKEN
homeassistant_api: true
ingress_port: 8090
panel_icon: mdi:television-play
panel_title: ArcTV
watchdog: http://[HOST]:[PORT:8090]/api/ping
# Данные (настройки, телевизоры, Избранное, сохранения, кэш) — в папке addon_configs/<…>_arctv:
# видна через аддон Samba и попадает в резервные копии Home Assistant
map:
  - type: addon_config
    read_only: false
